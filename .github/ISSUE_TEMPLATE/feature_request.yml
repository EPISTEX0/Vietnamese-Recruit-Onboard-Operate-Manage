name: Feature request
description: Propose a new feature or improvement for Vroom HR
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Before submitting, please:
        - Search open and closed issues to avoid duplicates.
        - Understand Vroom HR's domain boundaries in [CONTEXT.md](../../CONTEXT.md) — one concept must have one name.
        - For architectural-scale changes, expect that an [ADR](../../docs/adr/) will be required.

  - type: input
    id: title
    attributes:
      label: Feature Title
      description: Short, descriptive title of the proposed feature.
      placeholder: e.g. Bulk CV upload in the Recruitment Inbox
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / User Story
      description: What problem does this solve, and for whom? Describe the user need.
      placeholder: |
        As an [HR / Employee / System Admin],
        I want to ...
        so that ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you propose to solve the problem (high-level, not implementation detail).
      placeholder: Describe the feature and its intended behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches have you considered, and why were they rejected?
      placeholder: e.g. Workarounds, third-party tools, or design variations.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, links, references, or any other context.
    validations:
      required: false